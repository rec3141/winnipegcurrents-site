name: Daily data refresh

# 12:00 UTC = 07:00 America/Winnipeg during CDT (06:00 during CST — GitHub cron
# is UTC-only, so the local time shifts by an hour across DST). GitHub may also
# delay scheduled runs by several minutes under load.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the searchers but don't commit anything"
        type: boolean
        default: false

# The generator only ever writes data/ — index.html is off-limits.
permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Gather and merge events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/refresh.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data refresh $(date -u +%Y-%m-%d) (merged)"
          # Other actors push index.html; rebase so we never clobber them.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
